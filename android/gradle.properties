# Deliberately no proxy settings: the machine's local 7890 proxy answers 404 for the
# Maven repos, so repositories are pinned to Aliyun mirrors in settings.gradle.kts.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# A dead repo must fail fast instead of stalling the build for minutes.
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=45000
# Gradle's native-services/file-watching can't initialize on this box ("Could not initialize
# native services"); both are pure accelerators, so they are switched off.
org.gradle.native=false
org.gradle.vfs.watch=false
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# All SDK packages are already installed under android-sdk/ (platform 34, build-tools 34.0.0,
# platform-tools); dl.google.com is unreachable from this box, so AGP's remote manifest fetch
# would just hang. Fail fast instead of downloading anything.
android.builder.sdkDownload=false